version: "3.9"

services:
  # ── MongoDB ──
  mongodb:
    image: mongo:7
    container_name: neurovault-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: neurovault
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Express API Gateway ──
  api-gateway:
    build:
      context: ./backend/server
      dockerfile: Dockerfile
    container_name: neurovault-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/neurovault
      JWT_SECRET: neurovault-production-secret-change-me
      JWT_REFRESH_SECRET: neurovault-refresh-secret-change-me
      AI_CORE_URL: http://ai-core:8000
      CLIENT_URL: http://localhost:5173
    volumes:
      - upload_data:/app/uploads

  # ── FastAPI AI Core ──
  ai-core:
    build:
      context: ./backend/ai_core
      dockerfile: Dockerfile
    container_name: neurovault-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_MODEL: gemma3
    volumes:
      - ai_data:/app/data
      - upload_data:/app/uploads

  # ── React Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neurovault-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  mongo_data:
  upload_data:
  ai_data:
